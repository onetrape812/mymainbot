services:
  - type: web
    name: trapemainbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u run.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: CHANNEL_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: OWNER_USERNAME
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
